# Dispara o job de alertas de preço (/api/check-alerts) de hora em hora.
# A rota exige CRON_SECRET (sem ele responde 503). Segredos a cadastrar no GitHub
# (Settings → Secrets → Actions): SITE_URL (ex.: https://garimpopc.com.br) e CRON_SECRET.
name: Alertas de preço

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora, fora do minuto cheio para evitar pico
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar o job de alertas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Cadastre os segredos SITE_URL e CRON_SECRET."
            exit 1
          fi
          # -f faz o passo falhar em 4xx/5xx (ex.: 503 sem segredo no servidor, 401 segredo errado).
          curl -sS -f --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/check-alerts" | tee resultado.json
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alertas-resultado
          path: resultado.json
          if-no-files-found: ignore
